<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1340"/>
      <stop offset="0.55" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#0e3a5c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#16162e"/>
    </linearGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="640" cy="80" r="160" fill="#00a4dc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="140" cy="400" r="180" fill="#aa5cc3" opacity="0.14" filter="url(#glow)"/>

  <!-- screen -->
  <rect x="150" y="62" width="500" height="250" rx="22" fill="url(#jf)"/>
  <rect x="158" y="70" width="484" height="234" rx="16" fill="url(#screen)"/>
  <!-- play glyph hint -->
  <path d="M378 120 L378 180 L428 150 Z" fill="#ffffff" opacity="0.10"/>

  <!-- foreign speech bubble -->
  <g transform="translate(196 104)">
    <rect width="96" height="58" rx="14" fill="#ffffff" opacity="0.14"/>
    <path d="M22 58 L18 76 L40 58 Z" fill="#ffffff" opacity="0.14"/>
    <text x="48" y="39" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff" opacity="0.75">あ文</text>
  </g>

  <!-- subtitle lines -->
  <rect x="246" y="222" width="308" height="26" rx="6" fill="#000000" opacity="0.55"/>
  <rect x="258" y="231" width="284" height="8" rx="4" fill="#ffd34d"/>
  <rect x="286" y="258" width="228" height="26" rx="6" fill="#000000" opacity="0.55"/>
  <rect x="298" y="267" width="204" height="8" rx="4" fill="#ffd34d"/>

  <!-- FORCED badge -->
  <g transform="translate(548 40)">
    <rect width="136" height="46" rx="23" fill="#ffd34d"/>
    <text x="68" y="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#1a1340">FORCED</text>
  </g>

  <!-- wordmark -->
  <text x="400" y="380" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Forced Subtitles</text>
  <text x="400" y="416" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="20" fill="#c9c3e6" letter-spacing="1">never miss a line of dialogue</text>
</svg>
